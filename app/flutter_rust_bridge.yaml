# flutter_rust_bridge v2 code generation.
#
#   cd app && flutter_rust_bridge_codegen generate
#
# `rust_input` is the module the Dart side is generated from; everything reachable from
# `crate::api` is scanned. The API layer owns its own wire types (see `api` for why) so no
# external types need mirroring and this config stays minimal.
rust_input: crate::api
rust_root: rust/
dart_output: lib/bridge

dart_enums_style: true