[package]
name = "ink-engine"
description = "Handwriting engine: stroke pipeline, edit log and (later) the wgpu renderer. A plugin, not host code."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cordis-rs.workspace = true
inkweave-api.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
# The renderer. `bytemuck` is what lets a `#[repr(C)]` vertex go into a buffer without a copy through
# a `Vec<u8>`; `futures` only carries the blocking adapter/device requests (see `render::block_on`).
wgpu.workspace = true
bytemuck.workspace = true
futures.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }