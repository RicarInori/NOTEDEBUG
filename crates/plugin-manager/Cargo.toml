[package]
name = "plugin-manager"
description = "The unified control panel's backend: a PluginRegistry provider mounted like any other plugin."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The WASM sandbox is an M6 work item (the host-function ABI is a 2-3 week design task).
# Until it lands, `install` validates a package fully and then reports that the runtime is absent.
default = []
wasm-runtime = []

[dependencies]
cordis-rs.workspace = true
inkweave-api.workspace = true
# The native (cdylib) channel: `plugin-manager` owns the install policy, the loader owns the ABI.
ext-loader.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
serde.workspace = true
toml.workspace = true
# Only for the broadcast channel that carries state transitions to the UI.
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
# The install/uninstall test mounts for real, so it needs an async runtime.
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }